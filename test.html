  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      max-width: 90%;
      width: 100%;
      margin: 0 auto 30px;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 5px 12px 0 rgba(0, 0, 0, 0.2);

    .container-ellipsis {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

    table {
      width: 100%;
      border: 2px solid red;
    }
  </style>
</head>

    </tr>
  </table>

</html>
